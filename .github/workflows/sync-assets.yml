name: Sync production visual assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download production visuals
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 -o assets/hero-visual.png https://raw.githubusercontent.com/mks33119955-cpu/minusrazmer-nsk/main/assets/hero-visual.png
          curl -L --fail --retry 3 -o assets/equipment-visual.png https://raw.githubusercontent.com/mks33119955-cpu/minusrazmer-nsk/main/assets/equipment-visual.png
          file assets/hero-visual.png assets/equipment-visual.png

      - name: Commit assets when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-visual.png assets/equipment-visual.png
          if git diff --cached --quiet; then
            echo "Assets are already up to date."
            exit 0
          fi
          git commit -m "Add production visual assets"
          git push
