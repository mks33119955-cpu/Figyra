name: Site quality gate

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

jobs:
  static-site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check analytics.js

      - name: Check required SEO/legal invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path(".")
          index = (root / "index.html").read_text(encoding="utf-8")
          offer = (root / "offer.html").read_text(encoding="utf-8")
          robots = (root / "robots.txt").read_text(encoding="utf-8")
          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")

          required = [
              "6", "12", "15",
              "https://xn--80akfctdeyeev.xn--p1ai/",
              'name="description"',
              'rel="canonical"',
              'application/ld+json',
              'rel="preload" as="image" href="/assets/hero-visual.png" fetchpriority="high"'
          ]
          for item in required:
              if item not in index:
                  print(f"Missing required homepage invariant: {item}")
                  sys.exit(1)

          analytics = (root / "analytics.js").read_text(encoding="utf-8")
          if "analytics_consent_v2" not in analytics:
              print("Analytics consent must use the explicit versioned consent key")
              sys.exit(1)
          if 'data-consent="accept"' not in analytics or 'data-consent="reject"' not in analytics:
              print("Analytics consent must offer explicit accept and reject choices")
              sys.exit(1)
          if 'localStorage.setItem(KEY,"accepted")' not in analytics or 'localStorage.setItem(KEY,"rejected")' not in analytics:
              print("Analytics consent choices are not persisted separately")
              sys.exit(1)

          for page in ("ceny.html", "programmy.html", "apparatnyy-massazh.html",
                       "apparatnaya-korrekciya-figury.html", "pervyy-vizit.html", "faq.html"):
              html = (root / page).read_text(encoding="utf-8")
              for marker in ('href="/assets/page-shell.css"', 'class="site-header"', 'class="site-footer"'):
                  if marker not in html:
                      print(f"{page} is missing shared page template marker: {marker}")
                      sys.exit(1)

          prices = (root / "ceny.html").read_text(encoding="utf-8")
          programs = (root / "programmy.html").read_text(encoding="utf-8")
          for name in ("Старт", "Форма", "Перезагрузка"):
              if name not in prices + programs + index:
                  print(f"Missing approved program name: {name}")
                  sys.exit(1)

          schema = __import__("json").loads((root / "schema.json").read_text(encoding="utf-8"))
          if schema.get("address", {}).get("addressCountry") != "RU" or "postalCode" in schema.get("address", {}):
              print("Schema address must use ISO country code and omit unverified postal code")
              sys.exit(1)

          if not all(x in offer for x in ("6", "12", "15")):
              print("Offer does not contain current 6/12/15 program counts")
              sys.exit(1)

          if re.search(r"\b(?:5|10|17)\s*(?:процедур|сеансов)\b", index + offer):
              print("Legacy 5/10/17 program counts detected")
              sys.exit(1)

          if "Sitemap: https://xn--80akfctdeyeev.xn--p1ai/sitemap.xml" not in robots:
              print("robots.txt does not point to the canonical sitemap")
              sys.exit(1)

          urls = re.findall(r"<loc>(.*?)</loc>", sitemap)
          for url in urls:
              if not url.startswith("https://xn--80akfctdeyeev.xn--p1ai/"):
                  print(f"Non-canonical sitemap URL: {url}")
                  sys.exit(1)
              rel = url.split("/", 3)[-1] or "index.html"
              if rel != "index.html" and not (root / rel).exists():
                  print(f"Sitemap points to missing file: {rel}")
                  sys.exit(1)

          public_pages = ["index.html", "ceny.html", "programmy.html", "apparatnyy-massazh.html",
                          "apparatnaya-korrekciya-figury.html", "pervyy-vizit.html", "faq.html"]
          for page in public_pages:
              html = (root / page).read_text(encoding="utf-8")
              if re.search(r'<meta\s+name\s*=\s*(?:>|$)', html) or '\"><title>' in html:
                  print(f"{page} contains malformed meta/title markup")
                  sys.exit(1)
          prices_html = (root / "ceny.html").read_text(encoding="utf-8")
          expected_prices = ("1 300 ₽", "2 200 ₽", "7 200 ₽", "13 200 ₽", "16 500 ₽",
                             "12 600 ₽", "24 000 ₽", "28 500 ₽")
          for price in expected_prices:
              if price not in prices_html:
                  print(f"Missing approved price in pricing page: {price}")
                  sys.exit(1)
          for price in ("8 900 ₽", "16 900 ₽", "25 900 ₽"):
              if price in index + prices_html + programs + (root / "apparatnyy-massazh.html").read_text(encoding="utf-8"):
                  print(f"Legacy price remains on a public service page: {price}")
                  sys.exit(1)
          if 'href="https://dikidi.ru/#widget=214517"' not in prices_html:
              print("Pricing page is missing the DIKIDI booking link")
              sys.exit(1)
          for page in public_pages:
              html = (root / page).read_text(encoding="utf-8")
              for marker in ('property="og:title"', 'property="og:description"', 'property="og:url"',
                             'property="og:image"', 'property="og:locale" content="ru_RU"',
                             'rel="manifest" href="/site.webmanifest"', 'href="/favicon.ico"'):
                  if marker not in html:
                      print(f"{page} is missing social/share metadata: {marker}")
                      sys.exit(1)
              if html.count('rel="canonical"') != 1:
                  print(f"{page} must have exactly one canonical URL")
                  sys.exit(1)
              if not re.search(r'<link rel="canonical" href="[^"]+">', html):
                  print(f"{page} has a malformed canonical tag")
                  sys.exit(1)
              if re.search(r'<meta\s+name\s*=\s*(?:>|$)', html) or '\"><title>' in html:
                  print(f"{page} contains malformed meta/title markup")
                  sys.exit(1)
              if page != "index.html" and re.search(r'← (?:МИНУСРАЗМЕР|Вернуться на сайт)', html):
                  print(f"{page} still contains a duplicate legacy back link")
                  sys.exit(1)

          manifest = __import__("json").loads((root / "site.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("theme_color") != "#4f7fd8":
              print("Manifest theme color must match the site brand")
              sys.exit(1)

          vercel = __import__("json").loads((root / "vercel.json").read_text(encoding="utf-8"))
          if not any(h.get("source") == "/assets/(.*)" and any(x.get("key") == "Cache-Control" for x in h.get("headers", [])) for h in vercel.get("headers", [])):
              print("Static asset cache headers are missing")
              sys.exit(1)

          for page in ("apparatnaya-korrekciya-figury.html", "apparatnyy-massazh.html"):
              html = (root / page).read_text(encoding="utf-8")
              if 'https://xn--80akfctdeyeev.xn--p1ai/#business' not in html or '"price": "1300"' not in html:
                  print(f"{page} must reference the shared business entity and visible procedure price")
                  sys.exit(1)

          print("Static site invariants: OK")
          PY
